name: ShortDoc CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password_123
          POSTGRES_DB: shortdoc_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run Prisma Generate
        run: npx prisma generate
        working-directory: backend

      - name: Run Prisma Migrate Deploy
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:test_password_123@localhost:5432/shortdoc_test_db?schema=public

      - name: Seed Database
        run: npm run seed
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:test_password_123@localhost:5432/shortdoc_test_db?schema=public
          JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long_for_security

      - name: Typecheck Backend (tsc --noEmit)
        run: npx tsc --noEmit
        working-directory: backend

      - name: Run Vitest Integration Tests
        run: npm test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:test_password_123@localhost:5432/shortdoc_test_db?schema=public
          JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long_for_security
          PORT: 5000

      - name: Audit Backend Production Dependencies
        run: npm audit --omit=dev || true
        working-directory: backend

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint Frontend
        run: npm run lint
        working-directory: frontend

      - name: Build Next.js Frontend
        run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Audit Frontend Production Dependencies
        run: npm audit --omit=dev || true
        working-directory: frontend
